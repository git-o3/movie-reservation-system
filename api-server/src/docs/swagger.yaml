openapi: 3.0.0
info:
  title: Movie Reservation System API
  version: 1.0.0
  description: A modular monolith REST API managing movie reservations, theaters, showtimes and notifications.

servers:
  - url: http://localhost:8081/api/v1
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token in the format "Bearer <token>"

paths:
  /auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account and returns a signed JWT token.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: "John Doe" }
                email: { type: string, example: "john@example.com" }
                password: { type: string, example: "password123" }
      responses:
        201:
          description: User registered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  data:
                    type: object
                    properties:
                      token: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR..." }
                      user:
                        type: object
                        properties:
                          id: { type: string, example: "64f123abc456" }
                          email: { type: string, example: "john@example.com" }
                          role: { type: string, example: "user" }
        500:
          description: Duplicate email or system failure.

  /auth/login:
    post:
      summary: Authenticate an existing user
      description: Validates credentials and returns a JWT access token.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "john@example.com" }
                password: { type: string, example: "password123" }
      responses:
        200:
          description: Authentication successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  data:
                    type: object
                    properties:
                      token: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR..." }
                      user:
                        type: object
                        properties:
                          id: { type: string, example: "64f123abc456" }
                          email: { type: string, example: "john@example.com" }
                          role: { type: string, example: "user" }
        401:
          description: Invalid email or password.

  /movies:
    get:
      summary: Get all movies
      description: Returns a paginated list of all movies.
      tags: [Movies]
      responses:
        200:
          description: Movies fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string, example: "64f123abc456" }
                        name: { type: string, example: "Inception" }
                        language: { type: string, example: "English" }
                        rating: { type: number, example: 4.5 }
                        genres: { type: array, items: { type: string }, example: ["Sci-Fi"] }
                        availability: { type: boolean, example: true }
                        releaseDate: { type: string, example: "2010-07-16" }
                  pagination:
                    type: object
                    properties:
                      totalItems: { type: number, example: 10 }
                      totalPages: { type: number, example: 1 }
                      currentPage: { type: number, example: 1 }
                      limit: { type: number, example: 10 }
    post:
      summary: Create a movie
      description: Admin only — registers a new movie.
      tags: [Movies]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, language, releaseDate]
              properties:
                name: { type: string, example: "Inception" }
                language: { type: string, example: "English" }
                releaseDate: { type: string, example: "2010-07-16" }
                duration: { type: number, example: 148 }
                description: { type: string, example: "A mind-bending thriller." }
                genres: { type: array, items: { type: string }, example: ["Sci-Fi"] }
      responses:
        201:
          description: Movie created successfully.
        401:
          description: Unauthorized.
        403:
          description: Admin access required.

  /movies/{id}:
    get:
      summary: Get movie by id
      tags: [Movies]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Movie fetched successfully.
        404:
          description: Movie not found.
    put:
      summary: Update a movie
      description: Admin only — updates movie details.
      tags: [Movies]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Inception" }
                rating: { type: number, example: 4.5 }
                genres: { type: array, items: { type: string }, example: ["Sci-Fi"] }
                availability: { type: boolean, example: true }
      responses:
        200:
          description: Movie updated successfully.
        403:
          description: Admin access required.
    delete:
      summary: Delete a movie
      description: Admin only — removes a movie.
      tags: [Movies]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Movie deleted successfully.
        403:
          description: Admin access required.

  /theaters:
    get:
      summary: Get all theaters
      description: Returns a list of all theaters.
      tags: [Theaters]
      responses:
        200:
          description: Theaters fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string, example: "64f123abc456" }
                        name: { type: string, example: "IMAX Theater 1" }
                        location: { type: string, example: "Downtown" }
                        totalSeats: { type: number, example: 150 }
                        rows: { type: number, example: 10 }
                        seatsPerRow: { type: number, example: 15 }
                        vipRows: { type: array, items: { type: string }, example: ["A", "B"] }
                        carPark: { type: boolean, example: true }
    post:
      summary: Create a theater
      description: Admin only — registers a new theater and auto-generates seats.
      tags: [Theaters]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, location, totalSeats, rows, seatsPerRow]
              properties:
                name: { type: string, example: "IMAX Theater 1" }
                location: { type: string, example: "Downtown" }
                totalSeats: { type: number, example: 150 }
                rows: { type: number, example: 10 }
                seatsPerRow: { type: number, example: 15 }
                vipRows: { type: array, items: { type: string }, example: ["A", "B"] }
                carPark: { type: boolean, example: true }
                warning: { type: string, example: "Construction nearby" }
      responses:
        201:
          description: Theater created and seats generated successfully.
        401:
          description: Unauthorized.
        403:
          description: Admin access required.

  /theaters/{id}:
    get:
      summary: Get theater by id
      tags: [Theaters]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Theater fetched successfully.
        404:
          description: Theater not found.
    put:
      summary: Update a theater
      description: Admin only — updates theater details.
      tags: [Theaters]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "IMAX Theater 1" }
                location: { type: string, example: "Downtown" }
                warning: { type: string, example: "Construction nearby" }
                carPark: { type: boolean, example: true }
      responses:
        200:
          description: Theater updated successfully.
        403:
          description: Admin access required.
    delete:
      summary: Delete a theater
      description: Admin only — removes a theater and all its seats.
      tags: [Theaters]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Theater and seats deleted successfully.
        403:
          description: Admin access required.

  /showtimes:
    get:
      summary: Get all showtimes
      description: Returns a list of all showtimes.
      tags: [Showtimes]
      responses:
        200:
          description: Showtimes fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string, example: "64f123abc456" }
                        movieId: { type: string, example: "64f123abc456" }
                        theaterId: { type: string, example: "64f123abc456" }
                        startsAt: { type: string, example: "2026-06-10T14:00:00.000Z" }
                        endsAt: { type: string, example: "2026-06-10T16:30:00.000Z" }
                        format: { type: string, example: "IMAX" }
                        ticketCost:
                          type: object
                          properties:
                            regular: { type: number, example: 12.99 }
                            vip: { type: number, example: 24.99 }
    post:
      summary: Create a showtime
      description: Admin only — schedules a new showtime.
      tags: [Showtimes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movieId, theaterId, startsAt, endsAt, ticketCost]
              properties:
                movieId: { type: string, example: "64f123abc456" }
                theaterId: { type: string, example: "64f123abc456" }
                startsAt: { type: string, example: "2026-06-10T14:00:00.000Z" }
                endsAt: { type: string, example: "2026-06-10T16:30:00.000Z" }
                format: { type: string, enum: ["2D", "3D", "IMAX"], example: "IMAX" }
                ticketCost:
                  type: object
                  required: [regular, vip]
                  properties:
                    regular: { type: number, example: 12.99 }
                    vip: { type: number, example: 24.99 }
      responses:
        201:
          description: Showtime created successfully.
        401:
          description: Unauthorized.
        403:
          description: Admin access required.
        409:
          description: Overlapping showtime exists.

  /showtimes/{id}:
    get:
      summary: Get showtime by id
      tags: [Showtimes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Showtime fetched successfully.
        404:
          description: Showtime not found.
    put:
      summary: Update a showtime
      description: Admin only — updates showtime details.
      tags: [Showtimes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startsAt: { type: string, example: "2026-06-10T14:00:00.000Z" }
                endsAt: { type: string, example: "2026-06-10T16:30:00.000Z" }
                format: { type: string, enum: ["2D", "3D", "IMAX"], example: "IMAX" }
                ticketCost:
                  type: object
                  properties:
                    regular: { type: number, example: 12.99 }
                    vip: { type: number, example: 24.99 }
      responses:
        200:
          description: Showtime updated successfully.
        403:
          description: Admin access required.
    delete:
      summary: Delete a showtime
      description: Admin only — removes a showtime.
      tags: [Showtimes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Showtime deleted successfully.
        403:
          description: Admin access required.

  /reservations/showtimes/{showtimeId}/seats:
    get:
      summary: Get available seats for a showtime
      description: Returns all available seats for a given showtime.
      tags: [Reservations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: showtimeId
          required: true
          schema: { type: string }
      responses:
        200:
          description: Available seats fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string, example: "64f123abc456" }
                        seatLocation: { type: string, example: "A 1" }
                        isVip: { type: boolean, example: true }
                        status: { type: string, example: "available" }

  /reservations:
    get:
      summary: Get all reservations
      description: Admin only — returns all reservations.
      tags: [Reservations]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Reservations fetched successfully.
        403:
          description: Admin access required.
    post:
      summary: Create a reservation
      description: Authenticated user reserves a seat for a showtime.
      tags: [Reservations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [showtimeId, seatId]
              properties:
                showtimeId: { type: string, example: "64f123abc456" }
                seatId: { type: string, example: "64f123abc456" }
      responses:
        201:
          description: Reservation created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  data:
                    type: object
                    properties:
                      _id: { type: string, example: "64f123abc456" }
                      userId: { type: string, example: "64f123abc456" }
                      showtimeId: { type: string, example: "64f123abc456" }
                      seatId: { type: string, example: "64f123abc456" }
                      pricePaid: { type: number, example: 24.99 }
                      status: { type: string, example: "pending" }
                      confirmationDetail:
                        type: object
                        properties:
                          code: { type: string, example: "cd9ebe04-53d3-4e71-a08d-e5d575ca4920" }
                          generatedAt: { type: string, example: "2026-06-05T16:31:32.770Z" }
                          method: { type: string, example: "email" }
        400:
          description: Seat not available.
        401:
          description: Unauthorized.

  /reservations/my:
    get:
      summary: Get my reservations
      description: Returns all reservations belonging to the authenticated user.
      tags: [Reservations]
      security:
        - bearerAuth: []
      responses:
        200:
          description: User reservations fetched successfully.
        401:
          description: Unauthorized.

  /reservations/my/{reservationId}:
    get:
      summary: Get my reservation by id
      description: Returns a specific reservation belonging to the authenticated user.
      tags: [Reservations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          schema: { type: string }
      responses:
        200:
          description: Reservation fetched successfully.
        404:
          description: Reservation not found or does not belong to user.

  /reservations/{id}/cancel:
    patch:
      summary: Cancel a reservation
      description: Cancels a confirmed reservation and releases the seat.
      tags: [Reservations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Reservation cancelled successfully.
        400:
          description: Only confirmed reservations can be cancelled.
        403:
          description: No permission to cancel this reservation.

  /reservations/{reservationId}:
    get:
      summary: Get reservation by id
      description: Admin only — returns a specific reservation.
      tags: [Reservations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          schema: { type: string }
      responses:
        200:
          description: Reservation fetched successfully.
        403:
          description: Admin access required.
        404:
          description: Reservation not found.